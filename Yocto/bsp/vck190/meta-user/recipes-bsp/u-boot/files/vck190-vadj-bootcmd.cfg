# Enable VADJ before every boot (ported from the PetaLinux BSP's
# platform-top.h, HW-verified over UART on the bench 2026-07-07).
#
# On VCK190/VMK180 the FMC VADJ rail comes from the IR38164 buck regulator
# (U185, I2C addr 0x1E behind mux 0x74 channel 0 on LPD I2C0). Normally the
# system controller enables it, but doing it in u-boot (1) guarantees VADJ is
# up before Linux probes the FMC's Si5328/QSFPs (otherwise the clk driver
# probes a dead chip and the MRMAC GT never gets its refclk), and (2) works
# when the SC is absent or unconfigured.
#
# "i2c dev 3": in the EDF u-boot's DM numbering, LPD I2C0 (ff020000) is bus 3
# ("i2c bus" at the u-boot prompt lists it). The write sequence programs the
# 1.5V VADJ profile and sets the enable bit (0x22=0x80) last.
CONFIG_CMD_I2C=y
CONFIG_BOOTCOMMAND="i2c dev 3; i2c mw 0x74 0x00.0 0x01 0x1; i2c mw 0x1E 0x24.1 0x01 0x1; i2c mw 0x1E 0x25.1 0x80 0x1; i2c mw 0x1E 0x3A.1 0x01 0x1; i2c mw 0x1E 0x3B.1 0xF3 0x1; i2c mw 0x1E 0x3D.1 0x01 0x1; i2c mw 0x1E 0x3E.1 0xF3 0x1; i2c mw 0x1E 0x3F.1 0x00 0x1; i2c mw 0x1E 0x40.1 0x00 0x1; i2c mw 0x1E 0x41.1 0x00 0x1; i2c mw 0x1E 0x42.1 0x00 0x1; i2c mw 0x1E 0x22.1 0x80 0x1; run distro_bootcmd"
