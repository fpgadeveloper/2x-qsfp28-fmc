# 2x QSFP28 FMC on KCU116 (MicroBlaze): the design has no u-boot-capable
# Ethernet device (the CMAC / 40G-50G subsystem MACs are Linux-only via the
# axienet HSE patch). The microblaze-generic defconfig + PetaLinux fragment
# merge otherwise leaves CONFIG_NET=y with the DM_ETH core unbuilt, so
# board_late_init_xilinx (and netconsole) reference eth core symbols that are
# never linked (undefined references to eth_env_set_enetaddr_by_index /
# eth_get_dev / net_loop). Keep netconsole off and build the (driverless)
# DM_ETH core so the NET=y code links.
# CONFIG_NETCONSOLE is not set
CONFIG_NETDEVICES=y
CONFIG_DM_ETH=y
