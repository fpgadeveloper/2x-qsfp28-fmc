#User Configuration

# Install the QSFP28 loopback self-test (/usr/bin/qsfp-loopback-test) into
# the rootfs. This target wires a single QSFP port: run it as
# `qsfp-loopback-test --single` with a QSFP loopback plug fitted.
# Recipe: meta-user/recipes-apps/qsfp-loopback-test.
IMAGE_INSTALL:append = " qsfp-loopback-test"

#OE_TERMINAL = "tmux"
